<form method="get" class="cards-controls mb-4" role="search" data-live-cards aria-controls="table-results">
  <div class="search-field"><label class="form-label" for="table-query">Buscar</label><div class="search-with-clear"><input class="form-control" type="search" id="table-query" name="q" autocomplete="off" value="{{ q }}" placeholder="{{ search_placeholder }}"><button class="search-clear" type="button" aria-label="Limpiar búsqueda" title="Limpiar búsqueda" data-cards-clear hidden>×</button></div></div>

  <input type="hidden" name="sort" value="{{ sort }}">
  <div><label class="form-label" for="table-size">Filas</label><select class="form-select" id="table-size" name="per_page"><option{% if per_page == 10 %} selected{% endif %}>10</option><option{% if per_page == 25 %} selected{% endif %}>25</option><option{% if per_page == 50 %} selected{% endif %}>50</option></select></div>
  <button class="btn btn-primary" type="submit">Aplicar</button>
</form>
<p class="table-feedback small text-body-secondary" role="status" aria-live="polite" aria-atomic="true" data-cards-feedback></p>
