{% for column in columns %}<th scope="col" aria-sort="{{ column.direction }}"><a data-table-sort href="{% querystring sort=column.next_sort page=None %}">{{ column.label }} <span aria-hidden="true">{% if column.direction == 'ascending' %}↑{% elif column.direction == 'descending' %}↓{% else %}↕{% endif %}</span></a></th>{% endfor %}<th scope="col">Acciones</th>
