{% if info_actions %}<div class="dropdown info-actions-menu">
  <button id="info-actions-{{ action_key }}" class="info-actions-trigger" type="button" data-coreui-toggle="dropdown" aria-expanded="false" aria-label="{% if trigger_style == 'item_icon' %}Acciones del elemento{% else %}Acciones de {{ action_label }}{% endif %}" title="Acciones">{% if trigger_style == 'item_icon' %}⋮{% else %}⋯{% endif %}</button>
  <ul class="dropdown-menu dropdown-menu-end action-menu" aria-labelledby="info-actions-{{ action_key }}">
    {% for action in info_actions %}<li><a class="dropdown-item{% if action.danger %} action-danger{% endif %}" href="{{ action.url }}">{{ action.label }}</a></li>{% endfor %}
  </ul>
</div>{% endif %}
