<div class="dropdown">
  <button id="actions-{{ action_id }}" class="action-trigger dropdown-toggle" type="button" data-coreui-toggle="dropdown" aria-expanded="false" aria-label="Acciones de {{ action_label }}">Acciones</button>
  <ul class="dropdown-menu dropdown-menu-end action-menu" aria-labelledby="actions-{{ action_id }}">
    <li><a class="dropdown-item" href="{{ detail_url }}">{{ detail_label|default:'Ver detalle' }}</a></li>
    {% if record and not record.voided_at %}
    <li><a class="dropdown-item" href="{% url 'inventory:correct' project.pk record.position.item_id record.pk %}">Corregir</a></li>
    <li><a class="dropdown-item action-danger" href="{% url 'inventory:cancel' project.pk record.position.item_id record.pk %}">Anular</a></li>
    {% endif %}
  </ul>
  <noscript><a href="{{ detail_url }}">{{ detail_label|default:'Ver detalle' }}</a>{% if record and not record.voided_at %} · <a href="{% url 'inventory:correct' project.pk record.position.item_id record.pk %}">Corregir</a> · <a href="{% url 'inventory:cancel' project.pk record.position.item_id record.pk %}">Anular</a>{% endif %}</noscript>
</div>
