{% extends 'projects/base.html' %}
{% block title %}Nueva categoría{% endblock %}
{% block content %}
<div class="form-shell">
  <h1>Nueva categoría</h1>
  <form method="post" class="card card-body" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Guardar categoría</button>
      <a class="btn btn-outline-secondary" href="{% url 'catalog:categories' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
